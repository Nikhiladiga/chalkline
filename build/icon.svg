<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Chalkline: a chalkboard tile, two boxes, one snapped chalk line. -->
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#25272d"/>
      <stop offset="1" stop-color="#111215"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b95ff"/>
      <stop offset="1" stop-color="#5e6ad2"/>
    </linearGradient>
    <pattern id="dots" width="72" height="72" patternUnits="userSpaceOnUse" x="20" y="20">
      <circle cx="36" cy="36" r="3.2" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <!-- Chalk: roughen the stroke edges a little. -->
    <filter id="chalk" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <g filter="url(#lift)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#board)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#dots)" clip-path="url(#tile)"/>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="4"/>

  <!-- the chalk line, snapped at a right angle, ending in an arrow -->
  <g filter="url(#chalk)" fill="none" stroke="#f3f1ea" stroke-linecap="round" stroke-linejoin="round">
    <path d="M440 352 H460 Q484 352 484 376 V648 Q484 672 508 672 H576" stroke-width="30"/>
    <path d="M546 636 L584 672 L546 708" stroke-width="30"/>
    <!-- first box: drawn in chalk -->
    <rect x="216" y="240" width="224" height="224" rx="54" stroke-width="30"/>
  </g>

  <!-- second box: filled, the app's lavender -->
  <rect x="604" y="560" width="224" height="224" rx="54" fill="url(#ink)"/>
  <rect x="604" y="560" width="224" height="224" rx="54" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>
</svg>
